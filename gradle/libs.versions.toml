[versions]
kotlin = "2.4.10"
ktor = "3.5.1"
logback = "1.6.0"
flyway = "12.11.0"
hikari = "7.1.0"
jooq = "3.19.36"
sqlite = "3.53.2.1"
tika = "2.9.1"
natural-comparator = "1.1"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
spring-security = "7.0.4"
commons-logging = "1.4.0"
tsid-creator = "5.2.6"
cryptohash = "1.0.2"
jsoup = "1.21.1"
jspecify = "1.0.0"
pdfbox = "3.0.5"
junrar = "8.0.0"

[libraries]
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-server-sse = { module = "io.ktor:ktor-server-sse", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
natural-comparator = { module = "net.grey-panther:natural-comparator", version.ref = "natural-comparator" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto", version.ref = "spring-security" }
commons-logging = { module = "commons-logging:commons-logging", version.ref = "commons-logging" }
tsid-creator = { module = "com.github.f4b6a3:tsid-creator", version.ref = "tsid-creator" }
cryptohash = { module = "com.appmattus.crypto:cryptohash", version.ref = "cryptohash" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
junrar = { module = "com.github.junrar:junrar", version.ref = "junrar" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
