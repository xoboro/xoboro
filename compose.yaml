name: xoboro

services:
  xoboro:
    image: ${XOBORO_IMAGE:-xoboro:local}
    build:
      context: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      XOBORO_PORT: "25600"
      XOBORO_DATABASE_PATH: /config/xoboro.sqlite
      XOBORO_FONTS_PATH: /config/fonts
      XOBORO_CONTEXT_PATH: ${XOBORO_CONTEXT_PATH:-}
      XOBORO_LOG_LEVEL: ${XOBORO_LOG_LEVEL:-INFO}
    ports:
      - "${XOBORO_HTTP_PORT:-25600}:25600"
    volumes:
      - xoboro-config:/config
      - type: bind
        source: ${XOBORO_MEDIA_PATH:-./media}
        target: /media
        read_only: true
    tmpfs:
      - /tmp:rw,exec,size=1g,mode=1777
    stop_grace_period: 35s
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:25600${XOBORO_CONTEXT_PATH:-}/ready
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  xoboro-config:
