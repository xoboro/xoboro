org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
org.gradle.warning.mode=all

# Heap for the Kotlin compile daemon, which had none set and used its default.
#
# An incremental build never noticed. A full one does: `clean build --no-build-cache
# --rerun-tasks` recompiles every module, `org.gradle.parallel=true` puts several of them
# through the daemon at once, and it runs out of heap partway. The failure does not look
# like a memory problem - it surfaces as
#
#   BackendException: Backend Internal error: Exception during IR lowering
#   Could not read class: VirtualFile: .../java/util/regex/Pattern.class
#
# with `OutOfMemoryError` several `Caused by` levels down, which reads as a compiler bug in
# a file nobody touched. It was diagnosed as one here more than once, including after it
# reproduced in an isolated worktree - an isolated worktree is a full recompile, which is
# exactly when it happens, so the check that was meant to rule out contention was selecting
# for the real cause instead.
#
# The verification gate in docs/testing.md is a full rebuild, so without this the gate the
# repository prescribes cannot finish on a default configuration.
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.jvmargs=-Xmx3g

kotlin.code.style=official

