    get:
      tags: [Duplicate pages]
      operationId: get_duplicate_pages
      description: >-
        Page hashes that appear in more than one media item and have no recorded decision.
        Administrator-only. Marking a hash with any action removes it from this list.
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          required: false
