components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token returned by POST /setup or POST /session.
    cookieAuth:
      type: apiKey
      in: cookie
      name: XOBORO-SESSION
      description: >-
        Session cookie. Cookie-authenticated mutations additionally require the
        cross-site request protection described in docs/api/native-v1.md.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key issued through the self-service endpoints.
  schemas:
    XoboroMediaPosition:
      type: object
      required: [position, href, mediaType, progression, totalProgression]
      description: >-
        One EPUB reading position. `position` is one-based and ascending order *is*
        reading order, which no other response carries. `href` matches a resource-manifest
        `path` and is what the resource route is asked for verbatim. `totalProgression` is
        `position / count`, so it reports progress at the end of the position rather than
        at its start — one position ahead of the Readium convention, which
        `docs/api/native-v1.md` explains. Spelled out as an array of this schema rather
        than the bare `type: object` used elsewhere in this file, because being an ordered
        list is the entire value of this endpoint.
      properties:
        position: { type: integer }
        href: { type: string }
        mediaType: { type: string }
        progression: { type: number, format: float }
        totalProgression: { type: number, format: float }
        koboSpan:
          type: string
          nullable: true
          description: Present only for a KEPUB; what Kobo devices anchor to.
    XoboroApiError:
      type: object
      required: [code, message]
      description: >-
        The single error shape for the native API. `code` is a stable, specific identifier
        - it is deliberately not flattened to a generic not_found or forbidden, so a client
        can distinguish, for example, library_unavailable from library_not_found.
      properties:
        code:
          type: string
          examples: [library_unavailable, series_not_found, invalid_query]
        message:
          type: string
    XoboroDuplicatePageDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [DELETE_AUTO, DELETE_MANUAL, IGNORE]
          description: >-
            IGNORE removes the hash from the candidate list. DELETE_AUTO and DELETE_MANUAL are stored
            as the operator's stated intent; nothing in Xoboro performs page removal, because removing
            a page rewrites an archive on disk.
        sizeBytes:
          type: integer
          format: int64
          nullable: true
          description: >-
            Optional. A hash whose pages differ in size has no single size, and the candidate listing
            reports null for it.
    XoboroOAuth2Configuration:
      type: object
      description: >-
        Names and policy only. Deliberately carries no client id, client secret or
        endpoint URI: those would turn a configuration display into a credential
        disclosure, and an administrator who needs them already has the environment that
        holds them.
      required: [providers, accountCreationEnabled, oidcEmailVerificationRequired, accountLinking]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [registrationId, name]
            properties:
              registrationId: { type: string }
              name: { type: string }
        accountCreationEnabled:
          type: boolean
          description: >-
            Whether an external identity with no matching local account may create one.
        oidcEmailVerificationRequired:
          type: boolean
          description: >-
            Whether an OIDC provider must assert that it verified the email before the
            login is accepted at all.
        accountLinking:
          type: string
          enum: [VERIFIED_EMAIL, EMAIL, NEVER]
          description: >-
            Whether an external identity may sign in as an existing local account.
            VERIFIED_EMAIL, the default, requires the provider to have asserted that it
            verified the email - which a plain OAuth2 provider never does. EMAIL accepts
            an email match regardless, matching Komga. NEVER refuses a matching email
            rather than signing in or creating a duplicate.
    XoboroPage:
      type: object
      required: [items, page, size, totalItems, totalPages, hasPrevious, hasNext]
      description: The envelope every paged catalog collection returns.
      properties:
        items:
          type: array
          items: { type: object }
        page: { type: integer, description: Zero-based. }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
