  /api/xoboro/v1/series/feeds/new:
    get:
      tags: [Series]
      operationId: get_series_feed_new
      description: >-
        Recently added to the catalog, newest first. Sorted by when Xoboro created the row rather than the file's own timestamp: a decade-old file copied in today is new to this library.
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { type: object }
        "400":
          description: >-
            Invalid paging, or a `sort` parameter - a named feed owns its ordering and rejects an
            override rather than ignoring it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
