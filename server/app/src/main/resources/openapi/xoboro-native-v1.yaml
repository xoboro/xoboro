  /api/xoboro/v1/media-items/{mediaItemId}/positions:
    parameters:
      - name: mediaItemId
        in: path
        required: true
        description: Media-item identifier.
        schema:
          type: string
    get:
      tags: [Media items]
      summary: EPUB reading positions, in reading order.
      description: >-
        Spine-derived positions, ascending. The resource manifest is in OPF manifest
        order rather than reading order, so this is what an EPUB reader follows. The
        stored positions are returned with no filter by media kind, so anything that is
        not an EPUB comes back empty in practice because analysis records positions only
        for EPUBs. An EPUB whose media is not READY answers 409 rather than an empty
        list, so a reader can tell "no positions" from "not analysed yet".
      operationId: get_media_items_mediaItemId_positions
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/XoboroMediaPosition" }
        "401":
          description: Not authenticated.
