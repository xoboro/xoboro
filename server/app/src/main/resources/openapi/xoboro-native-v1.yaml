  /api/xoboro/v1/media-items/{mediaItemId}/positions:
    parameters:
      - name: mediaItemId
        in: path
        required: true
        description: Media-item identifier.
        schema:
          type: string
    get:
      tags: [Media items]
      summary: EPUB reading positions, in reading order.
      description: >-
        Spine-derived positions, ascending. The resource manifest is in OPF manifest
        order rather than reading order, so this is what an EPUB reader follows. Empty
        for anything that is not an EPUB; an EPUB whose media is not READY answers 409
        rather than an empty list, so a reader can tell "no positions" from "not
        analysed yet".
      operationId: get_media_items_mediaItemId_positions
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/XoboroMediaPosition" }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "403":
          description: Authenticated but not permitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "404":
          description: >-
            Not found, or not visible to this user. An unauthorised identifier
            returns 404 rather than 403 so grants cannot be enumerated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "409":
          description: >-
            The EPUB's media is not usable yet: `media_not_ready` while it is
            unanalysed, `media_unsupported` when it cannot be read at all.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
