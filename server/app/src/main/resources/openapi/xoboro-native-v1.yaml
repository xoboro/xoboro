components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token returned by POST /setup or POST /session.
    cookieAuth:
      type: apiKey
      in: cookie
      name: XOBORO-SESSION
      description: >-
        Session cookie. Cookie-authenticated mutations additionally require the
        cross-site request protection described in docs/api/native-v1.md.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key issued through the self-service endpoints.
  schemas:
    XoboroMediaProgressRequest:
      type: object
      required: [page, deviceId, deviceName, modifiedAtMillis]
      description: >-
        A read-progress write. `locator` is deliberately **not** required: a comic has
        neither a spine nor an `href` to point at, so its reader sends a page alone,
        while an EPUB reader sends both. `page` is required in either case - it is the
        position this surface stores and orders by, not an alternative to the locator.
      properties:
        page:
          type: integer
          minimum: 1
          description: >-
            One-based page, within the analyzed page count. A value outside that range is
            `400` rather than being clamped, so a client cannot quietly store a position
            the item does not have.
        locator:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            An opaque Readium locator, stored and returned as given and never interpreted.
            Omit it when the reader has none; an empty object is not the same statement,
            because it claims a locator was recorded and carried no fields.
        deviceId:
          type: string
          description: Which device wrote this, so a conflict can name the other one.
        deviceName:
          type: string
          description: Human-readable device name, shown when a conflict is offered to the reader.
        modifiedAtMillis:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The client's own clock, and the sole conflict-ordering key - the server does not
            substitute its own. A value older than **or equal to** the stored one is refused
            with `409`, so a client writing twice within one millisecond must supply a
            strictly increasing value rather than a bare wall-clock reading.
    XoboroMediaProgressResponse:
      type: object
      required: [page, completed, readAtMillis, updatedAtMillis]
      description: The stored progress after a write, or as currently held.
      properties:
        page:
          type: integer
          minimum: 1
        completed:
          type: boolean
          description: >-
            Derived from the page and the analyzed page count rather than sent by the
            client, so it cannot disagree with the position it accompanies.
        readAtMillis:
          type: integer
          format: int64
          description: The client clock the write carried, preserved as the ordering key.
        updatedAtMillis:
          type: integer
          format: int64
          description: When the server stored it, which is a different clock from `readAtMillis`.
        deviceId:
          type: string
          nullable: true
        deviceName:
          type: string
          nullable: true
        locator:
          type: object
          additionalProperties: true
          nullable: true
          description: Absent when the reader that wrote this had no locator.
    XoboroMediaPosition:
      type: object
      required: [position, href, mediaType, progression, totalProgression]
      description: >-
        One EPUB reading position. `position` is one-based and ascending order *is*
        reading order, which no other response carries. `href` matches a resource-manifest
        `path` and is what the resource route is asked for verbatim. `totalProgression` is
        `position / count`, so it reports progress at the end of the position rather than
        at its start — one position ahead of the Readium convention, which
        `docs/api/native-v1.md` explains. Spelled out as an array of this schema rather
        than the bare `type: object` used elsewhere in this file, because being an ordered
        list is the entire value of this endpoint.
      properties:
        position: { type: integer }
        href: { type: string }
        mediaType: { type: string }
        progression: { type: number, format: float }
        totalProgression: { type: number, format: float }
        koboSpan:
          type: string
          description: >-
            Present only for a KEPUB; what Kobo devices anchor to. **Absent**, not null, when there
            is none: the server serializes with `explicitNulls = false`, so it omits the key rather
            than sending `null`. Declaring it `nullable` described a value this API cannot emit.
    XoboroApiError:
      type: object
      required: [code, message]
      description: >-
        The single error shape for the native API. `code` is a stable, specific identifier
        - it is deliberately not flattened to a generic not_found or forbidden, so a client
        can distinguish, for example, library_unavailable from library_not_found.
      properties:
        code:
          type: string
          examples: [library_unavailable, series_not_found, invalid_query]
        message:
          type: string
    XoboroDuplicatePageDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [DELETE_AUTO, DELETE_MANUAL, IGNORE]
          description: >-
            IGNORE removes the hash from the candidate list. DELETE_AUTO and DELETE_MANUAL are stored
            as the operator's stated intent and do not by themselves remove anything; a follow-up
            `POST .../removals` call executes a hash recorded with either of these two actions.
        sizeBytes:
          type: integer
          format: int64
          description: >-
            Optional. A hash whose pages differ in size has no single size, and the candidate listing
            **omits** the key for it rather than sending `null` - the server serializes with
            `explicitNulls = false`. A consumer has to treat absent as "no single size" rather than
            as zero.
    XoboroDuplicatePageRemovalRequest:
      type: object
      properties:
        mediaItemIds:
          type: array
          items: { type: string }
          nullable: true
          description: >-
            Restricts removal to matches whose media item is in this list. Omitted, or an explicit
            `null`, queues removal for every media item carrying the hash. The enclosing body is
            required even when this field is not.
    XoboroDuplicatePageRemovalResponse:
      type: object
      required: [queuedMediaItems]
      properties:
        queuedMediaItems:
          type: integer
          description: How many media items had a removal task queued for them.
    XoboroOAuth2Configuration:
      type: object
      description: >-
        Names and policy only. Deliberately carries no client id, client secret or
        endpoint URI: those would turn a configuration display into a credential
        disclosure, and an administrator who needs them already has the environment that
        holds them.
      required: [providers, accountCreationEnabled, oidcEmailVerificationRequired, accountLinking]
      properties:
        providers:
          type: array
          items:
            type: object
            required: [registrationId, name]
            properties:
              registrationId: { type: string }
              name: { type: string }
        accountCreationEnabled:
          type: boolean
          description: >-
            Whether an external identity with no matching local account may create one.
        oidcEmailVerificationRequired:
          type: boolean
          description: >-
            Whether an OIDC provider must assert that it verified the email before the
            login is accepted at all.
        accountLinking:
          type: string
          enum: [VERIFIED_EMAIL, EMAIL, NEVER]
          description: >-
            Whether an external identity may sign in as an existing local account.
            VERIFIED_EMAIL, the default, requires the provider to have asserted that it
            verified the email - which a plain OAuth2 provider never does. EMAIL accepts
            an email match regardless, matching Komga. NEVER refuses a matching email
            rather than signing in or creating a duplicate.
    XoboroPage:
      type: object
      required: [items, page, size, totalItems, totalPages, hasPrevious, hasNext]
      description: The envelope every paged catalog collection returns.
      properties:
        items:
          type: array
          items: { type: object }
        page: { type: integer, description: Zero-based. }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        hasPrevious: { type: boolean }
        hasNext: { type: boolean }
