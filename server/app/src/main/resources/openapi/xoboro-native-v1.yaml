  /api/xoboro/v1/duplicate-pages/decided:
    get:
      tags: [Duplicate pages]
      operationId: get_decided_duplicate_pages
      description: >-
        Page hashes with a recorded decision, optionally filtered by action. Omitting `action`
        returns every decision. Note that Xoboro records decisions and does not perform removal;
        `deleteCount` is therefore always 0.
      parameters:
        - name: action
          in: query
          required: false
          description: Repeatable. One of DELETE_AUTO, DELETE_MANUAL, IGNORE.
          schema:
            type: string
            enum: [DELETE_AUTO, DELETE_MANUAL, IGNORE]
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, default: 20 }
