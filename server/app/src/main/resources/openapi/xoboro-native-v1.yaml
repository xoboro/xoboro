  /api/xoboro/v1/read-lists/{readListId}/file:
    parameters:
      - name: readListId
        in: path
        required: true
        description: Read-list identifier.
        schema:
          type: string
    get:
      tags: [Read lists]
      operationId: get_read_lists_readListId_file
      description: >-
        Downloads the read list's media items as one zip archive, in list order.
        Entries are prefixed with each member's one-based position in the read
        list. Members the caller may not read are omitted. Requires the
        FILE_DOWNLOAD role. The archive is streamed as it is assembled, so the
        response carries no Content-Length, no ETag and no Accept-Ranges;
        download a member through /media-items/{mediaItemId}/file to resume by
        byte range.
      responses:
        "200":
          description: Zip archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "403":
          description: >-
            file_download_forbidden when the user lacks the FILE_DOWNLOAD role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "404":
          description: >-
            read_list_not_found when the read list does not exist, or when the
            caller may read none of its media items. An unauthorised identifier
            returns 404 rather than 403 so grants cannot be enumerated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
