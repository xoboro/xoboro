# OpenAPI description of the Xoboro native API.
#
# Path and method parity with the running server is enforced by
# XoboroNativeOpenApiContractTest, which walks Ktor's routing tree and compares it with
# this file. A route added without an entry here fails that test, and an entry here with
# no route fails it too - so this description cannot quietly drift, which is the usual
# fate of a hand-maintained spec.
#
# Prose descriptions of request and response bodies, error codes and cache semantics live
# in docs/api/native-v1.md. This file is the machine-readable surface: paths, methods,
# parameters, authentication and status codes.
openapi: 3.1.0
info:
  title: Xoboro native API
  version: v1
  description: >-
    The native Xoboro HTTP API. Distinct from the Komga compatibility surface under
    /api/v1, which exists for transition and may be removed - see ADR 0082.
servers:
  - url: /
    description: The Xoboro server itself.
security:
  - bearerAuth: []
  - cookieAuth: []
  - apiKeyAuth: []
tags:
  - name: Authentication activity
  - name: Client settings
  - name: Collections
  - name: Documentation
  - name: Events
  - name: Facets
  - name: History
  - name: Libraries
  - name: Media items
  - name: Operations
  - name: Read lists
  - name: Self service
  - name: Series
  - name: Server settings
  - name: Session
  - name: Setup
  - name: User administration
paths:
  /api/xoboro/v1/authentication-activity:
    get:
      tags: [Authentication activity]
      operationId: get_authentication_activity
      parameters:
        - name: page
          in: query
          required: false
          description: >-
            Zero-based page index.
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: >-
            Page size, between 1 and 200.
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          description: >-
            Repeatable `field[,asc|desc]`. An unknown field returns 400 invalid_query rather than being silently coerced.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid request body or query parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "403":
          description: Authenticated but not permitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
  /api/xoboro/v1/authentication/oauth2:
    get:
      tags: [Authentication activity]
      operationId: get_oauth2_configuration
      description: >-
        Reports the OAuth2/OIDC providers this deployment resolved and the effective
        login policy. Administrator-only, and read-only: provider registration lives in
        environment variables so client secrets never enter the database, and no client
        id, client secret or endpoint URI is returned. See ADR 0093.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroOAuth2Configuration" }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "403":
          description: Authenticated but not an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
