  /api/xoboro/v1/duplicate-pages/{pageHash}:
    put:
      tags: [Duplicate pages]
      operationId: put_duplicate_page_decision
      description: >-
        Records what should happen to a duplicate page. IGNORE takes effect immediately by removing
        the hash from the candidate list. DELETE_AUTO and DELETE_MANUAL only record intent; a
        follow-up `POST .../removals` call is what executes them.
      parameters:
        - name: pageHash
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XoboroDuplicatePageDecision" }
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema: { type: object }
        "400":
          description: Invalid query parameter or request body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "403":
          description: Authenticated but not an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
  /api/xoboro/v1/duplicate-pages/{pageHash}/removals:
    post:
      tags: [Duplicate pages]
      operationId: post_duplicate_page_removal
      description: >-
        Executes a previously recorded DELETE_AUTO or DELETE_MANUAL decision by queuing removal of
        the matching archive entries. Rewrites an archive on the operator's disk once the queued
        task runs, which is why this refuses to run against a hash with no recorded delete decision.
        The request body is required. Its `mediaItemIds` restricts which matches are queued; a null
        or omitted `mediaItemIds` queues every match. A request with no body at all is refused
        rather than taken for either, because a chunked request carries a body and declares no
        Content-Length, so no reliable test distinguishes them - and here one side of that
        ambiguity is rewriting every archive carrying the hash.
      parameters:
        - name: pageHash
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XoboroDuplicatePageRemovalRequest" }
      responses:
        "202":
          description: Accepted; removal has been queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroDuplicatePageRemovalResponse" }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "403":
          description: Authenticated but not an administrator.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "404":
          description: A requested media item does not carry this page hash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "409":
          description: The page hash has no recorded DELETE_AUTO or DELETE_MANUAL decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
  /api/xoboro/v1/duplicate-pages/{pageHash}/media-items:
    get:
      tags: [Duplicate pages]
      operationId: get_duplicate_page_media_items
      description: Every media item and page number carrying this hash. Administrator-only.
