      description: >-
        Downloads the series' media items as one zip archive, ordered by
        numberSort. Deleted items, items whose file cannot be opened, and items
        the caller may not read are omitted; a visible series with no readable
        items answers an empty archive. Requires the FILE_DOWNLOAD role. The
