  /api/xoboro/v1/media-items/{mediaItemId}/progress:
    parameters:
      - name: mediaItemId
        in: path
        required: true
        description: Media-item identifier.
        schema:
          type: string
    put:
      tags: [Media items]
      operationId: put_media_items_mediaItemId_progress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/XoboroMediaProgressRequest" }
      responses:
        "200":
          description: >-
            Applied. The body is the stored progress, not an echo of the request:
            `completed` is derived from the page and the analyzed page count, and
            `updatedAtMillis` is the server's write time rather than the client clock.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroMediaProgressResponse" }
        "409":
          description: >-
            The stored progress is at least as new as this write, so it was refused
            rather than applied. `modifiedAtMillis` is the client's own clock and the
            sole ordering key, and equal counts as stale, so a second device cannot
            silently rewind a reader's place.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "400":
          description: Invalid request body or query parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "403":
          description: Authenticated but not permitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
        "404":
          description: >-
            Not found, or not visible to this user. An unauthorised identifier
            returns 404 rather than 403 so grants cannot be enumerated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/XoboroApiError" }
    delete:
      tags: [Media items]
      operationId: delete_media_items_mediaItemId_progress
      description: >-
