name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - ".env.example"
      - "Dockerfile"
      - "compose.yaml"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "**/*.gradle.kts"
      - "**/src/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/xoboro/xoboro

jobs:
  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: xoboro:smoke
          cache-from: type=gha,scope=xoboro-container
          cache-to: type=gha,mode=max,scope=xoboro-container

      - name: Start and verify image
        run: |
          docker run --detach --name xoboro-smoke \
            --read-only \
            --tmpfs /tmp:rw,exec,size=1g,mode=1777 \
            --tmpfs /config:rw,size=256m,mode=0755,uid=10001,gid=10001 \
            xoboro:smoke
          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' xoboro-smoke)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs xoboro-smoke
              exit 1
            fi
            sleep 2
          done
          docker logs xoboro-smoke
          exit 1

      - name: Show logs after failure
        if: failure()
        run: docker logs xoboro-smoke || true

  publish:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=xoboro-container
          cache-to: type=gha,mode=max,scope=xoboro-container
          provenance: mode=max
          sbom: true
