name: Container

# Automatic triggers are paused: this is a private repository, so every Actions minute is
# billed, and the account hit its Actions spending limit. GitHub refuses to start the jobs at
# all in that state, which turns every check into a red cross that says nothing about the code.
#
# The workflow is unchanged otherwise and still runs on demand:
#
#   gh workflow run "Container" --ref <branch>
#
# To restore automatic runs, put the trigger block below back (see git history for this file):
#
#   push:
#     branches:
#       - main
#     tags:
#       - "v*"
#   pull_request:
#     paths: <see git history>

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/xoboro/xoboro

jobs:
  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: xoboro:smoke
          cache-from: type=gha,scope=xoboro-container
          cache-to: type=gha,mode=max,scope=xoboro-container

      # Delegated to a script so this gate is runnable by hand, which matters while automatic
      # triggers are paused: a check that only exists inside a workflow nobody runs is not a check.
      # It replaces an inline `docker run` that waited for the healthcheck and stopped there. That
      # proved the server starts and nothing about the release - the web UI is a separate build
      # stage copied in, so an image shipping no user interface reported healthy - and it dropped no
      # capabilities, so it passed under weaker confinement than any real deployment runs with.
      - name: Verify the packaged image
        run: scripts/container-acceptance.sh xoboro:smoke

  publish:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=xoboro-container
          cache-to: type=gha,mode=max,scope=xoboro-container
          provenance: mode=max
          sbom: true
