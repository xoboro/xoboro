name: Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/container.yml"
      - ".dockerignore"
      - ".env.example"
      - "Dockerfile"
      - "compose.yaml"
      - "scripts/container-acceptance.sh"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "**/*.gradle.kts"
      - "core/**"
      - "compatibility/komga-api/**"
      - "server/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/xoboro/xoboro

jobs:
  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build native image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: xoboro:smoke
          cache-from: type=gha,scope=xoboro-container
          cache-to: type=gha,mode=max,scope=xoboro-container

      # Delegated to a script so the same release gate is runnable both locally and in CI.
      # It replaces an inline `docker run` that waited for the healthcheck and stopped there. That
      # proved the server starts and nothing about the release - the web UI is a separate build
      # stage copied in, so an image shipping no user interface reported healthy - and it dropped no
      # capabilities, so it passed under weaker confinement than any real deployment runs with.
      - name: Verify the packaged image
        run: scripts/container-acceptance.sh xoboro:smoke

  publish:
    name: Publish multi-architecture image
    if: github.event_name != 'pull_request'
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional so this job still publishes on a checkout that has no
      # Docker Hub credentials - a fork, or this repository before the secrets are
      # added. Failing the release because a second registry is unconfigured would
      # make the primary one unreachable too.
      - name: Resolve target registries
        id: registries
        env:
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          images='${{ env.IMAGE_NAME }}'
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_REPOSITORY:-}" ]; then
            # $'\n' rather than a literal newline inside the quotes: a line break in a
            # YAML block scalar carries this step's indentation into the value, and a
            # leading-space image name is not the same image name.
            images="$images"$'\n'"docker.io/$DOCKERHUB_REPOSITORY"
            echo 'dockerhub=true' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerhub=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Docker Hub is not configured (needs the DOCKERHUB_REPOSITORY variable and the DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets); publishing to GHCR only.'
          fi
          {
            echo 'images<<IMAGES_EOF'
            echo "$images"
            echo 'IMAGES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=xoboro-container
          cache-to: type=gha,mode=max,scope=xoboro-container
          provenance: mode=max
          sbom: true
