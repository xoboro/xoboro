name: Komga differential

on:
  pull_request:
    paths:
      - ".github/workflows/differential.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "core/**"
      - "compatibility/komga-api/**"
      - "compatibility/komga-differential/**"
      - "server/app/**"
      - "server/metadata/**"
      - "server/persistence/**"
      - "server/sources/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: komga-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous:
    name: Anonymous baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up project tools
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Xoboro candidate
        run: ./gradlew :server:app:installDist

      - name: Start reference Komga
        run: |
          docker run --detach --name komga-reference \
            --publish 127.0.0.1:25610:25600 \
            --volume "${RUNNER_TEMP}:${RUNNER_TEMP}" \
            --env KOMGA_CORS_ALLOWEDORIGINS=https://reader.example.invalid \
            gotson/komga@sha256:c4f9885fc077e2e9cd684dc95e8f6cfa5e33b100b46712b2de7f5cc2ff59e6fb

      - name: Start Xoboro candidate
        run: |
          XOBORO_PORT=25611 \
          XOBORO_DATABASE_PATH="${RUNNER_TEMP}/xoboro.sqlite" \
          KOMGA_CORS_ALLOWEDORIGINS=https://reader.example.invalid \
          server/app/build/install/app/bin/app >"${RUNNER_TEMP}/xoboro.log" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/xoboro.pid"

      - name: Wait for both servers
        run: |
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:25610/api/v1/claim >/dev/null &&
              curl --fail --silent http://127.0.0.1:25611/api/v1/claim >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Compare anonymous contracts
        run: |
          ./gradlew :compatibility:komga-differential:run --args="\
          --reference http://127.0.0.1:25610 \
          --candidate http://127.0.0.1:25611 \
          --suite compatibility/komga-differential/suites/komga-1.25.0-anonymous.json"

      - name: Verify anonymous shallow revalidation
        run: |
          for endpoint in api/v1/claim api/v1/oauth2/providers; do
            for port in 25610 25611; do
              url="http://127.0.0.1:${port}/${endpoint}"
              etag="$(
                curl --fail --silent --show-error \
                  --dump-header - --output /dev/null "${url}" |
                  awk -F': ' 'tolower($1) == "etag" {
                    sub("\r$", "", $2)
                    print $2
                  }'
              )"
              test -n "${etag}"
              http_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --header "If-None-Match: ${etag}" "${url}"
              )"
              test "${http_status}" = "304"
            done
          done

      - name: Create synthetic catalog
        env:
          SYNTHETIC_EMAIL: admin@example.invalid
          SYNTHETIC_PASSWORD: xoboro-differential-only
        run: |
          catalog_root="${RUNNER_TEMP}/catalog"
          archive_root="${RUNNER_TEMP}/archive"
          mkdir -p \
            "${catalog_root}/Synthetic Series" \
            "${catalog_root}/oneshots" \
            "${archive_root}"
          printf '%s' \
            'iVBORw0KGgoAAAANSUhEUgAAABgAAAAgAQMAAAAykCp7AAAAA1BMVEUTfItA+kyhAAAADElEQVQI12NgGFgAAACAAAElMfVGAAAAAElFTkSuQmCC' \
            | base64 --decode >"${archive_root}/0001.png"
          cp "${archive_root}/0001.png" "${archive_root}/0002.png"
          printf '%s' \
            '<?xml version="1.0" encoding="UTF-8"?><ComicInfo><Title>Synthetic Chapter</Title><Series>Synthetic Series</Series><Number>1</Number><Count>2</Count><Year>2025</Year><Month>1</Month><Day>2</Day><Summary>Synthetic chapter summary</Summary><Writer>Synthetic Author</Writer><Publisher>Synthetic Publisher</Publisher><Genre>Adventure, Synthetic</Genre><LanguageISO>en</LanguageISO><AgeRating>Teen</AgeRating><Tags>sample</Tags></ComicInfo>' \
            >"${archive_root}/ComicInfo.xml"
          (
            cd "${archive_root}"
            zip --quiet "${catalog_root}/Synthetic Series/001.cbz" \
              0001.png 0002.png ComicInfo.xml
          )
          printf '%s' \
            '<?xml version="1.0" encoding="UTF-8"?><ComicInfo><Title>Synthetic Chapter Two</Title><Series>Synthetic Series</Series><Number>2</Number><Count>2</Count><Year>2026</Year><Month>2</Month><Day>3</Day><Summary>Second synthetic chapter summary</Summary><Writer>Synthetic Author</Writer><Publisher>Synthetic Publisher</Publisher><Genre>Adventure, Synthetic</Genre><LanguageISO>en</LanguageISO><AgeRating>Teen</AgeRating><Tags>sample</Tags></ComicInfo>' \
            >"${archive_root}/ComicInfo.xml"
          (
            cd "${archive_root}"
            zip --quiet "${catalog_root}/Synthetic Series/002.cbz" \
              0001.png 0002.png ComicInfo.xml
          )
          printf '%s' \
            '<?xml version="1.0" encoding="UTF-8"?><ComicInfo><Title>Synthetic Standalone</Title><Series>Synthetic Standalone</Series><Number>1</Number><Count>1</Count><Year>2024</Year><Month>3</Month><Day>4</Day><Summary>Synthetic standalone summary</Summary><Writer>Synthetic Author</Writer><Publisher>Synthetic Publisher</Publisher><Genre>Standalone</Genre><LanguageISO>en</LanguageISO><AgeRating>Teen</AgeRating><Tags>standalone</Tags></ComicInfo>' \
            >"${archive_root}/ComicInfo.xml"
          (
            cd "${archive_root}"
            zip --quiet "${catalog_root}/oneshots/standalone.cbz" \
              0001.png 0002.png ComicInfo.xml
          )

          for port in 25610 25611; do
            curl --fail --silent --show-error --request POST \
              "http://127.0.0.1:${port}/api/v1/claim" \
              --header "X-Komga-Email: ${SYNTHETIC_EMAIL}" \
              --header "X-Komga-Password: ${SYNTHETIC_PASSWORD}" >/dev/null
            jq --null-input --compact-output \
              --arg root "${catalog_root}" \
              '{
                name: "Synthetic Library",
                root: $root,
                scanInterval: "DISABLED",
                scanOnStartup: false,
                scanDirectoryExclusions: [],
                oneshotsDirectory: "oneshots",
                hashFiles: false,
                hashPages: false,
                analyzeDimensions: true,
                repairExtensions: false,
                convertToCbz: false,
                emptyTrashAfterScan: false,
                seriesCover: "FIRST"
              }' |
              curl --fail --silent --show-error \
                --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                --request POST "http://127.0.0.1:${port}/api/v1/libraries" \
                --header "Content-Type: application/json" \
                --data-binary @- >/dev/null
          done

          catalog_ready_filter='if (.content | length) == 3 and
              all(.content[]; .media.status == "READY") and
              any(.content[];
                .oneshot == true and
                .seriesTitle == "Synthetic Standalone")
            then "READY" else "" end'
          series_ready_filter='if (.content | length) == 2 and
              all(.content[];
                any(.booksMetadata.authors[]?;
                  .name == "Synthetic Author" and .role == "writer") and
                .booksMetadata.releaseDate != null and
                .booksMetadata.summary != "" and
                (.booksMetadata.tags | length) > 0)
            then "READY" else "" end'

          catalog_ready=false
          for attempt in $(seq 1 300); do
            reference_books="$(
              curl --silent --show-error \
                --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                "http://127.0.0.1:25610/api/v1/books?page=0&size=20"
            )"
            candidate_books="$(
              curl --silent --show-error \
                --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                "http://127.0.0.1:25611/api/v1/books?page=0&size=20"
            )"
            reference_series="$(
              curl --silent --show-error \
                --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                "http://127.0.0.1:25610/api/v1/series?page=0&size=20"
            )"
            candidate_series="$(
              curl --silent --show-error \
                --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                "http://127.0.0.1:25611/api/v1/series?page=0&size=20"
            )"
            reference_status="$(
              printf '%s' "${reference_books}" |
                jq --raw-output "${catalog_ready_filter}" 2>/dev/null || true
            )"
            candidate_status="$(
              printf '%s' "${candidate_books}" |
                jq --raw-output "${catalog_ready_filter}" 2>/dev/null || true
            )"
            reference_series_status="$(
              printf '%s' "${reference_series}" |
                jq --raw-output "${series_ready_filter}" 2>/dev/null || true
            )"
            candidate_series_status="$(
              printf '%s' "${candidate_series}" |
                jq --raw-output "${series_ready_filter}" 2>/dev/null || true
            )"
            if [ "${reference_status}" = "READY" ] &&
              [ "${candidate_status}" = "READY" ] &&
              [ "${reference_series_status}" = "READY" ] &&
              [ "${candidate_series_status}" = "READY" ]; then
              catalog_ready=true
              break
            fi
            sleep 1
          done
          if [ "${catalog_ready}" != "true" ]; then
            {
              echo "Synthetic catalog was not ready after ${attempt} attempts."
              echo "reference status: '${reference_status}' (empty means the filter did not match)"
              echo "candidate status: '${candidate_status}'"
              echo "reference series status: '${reference_series_status}'"
              echo "candidate series status: '${candidate_series_status}'"
              echo "--- reference 127.0.0.1:25610 /api/v1/books ---"
              printf '%s\n' "${reference_books}" | jq . || printf '%s\n' "${reference_books}"
              echo "--- candidate 127.0.0.1:25611 /api/v1/books ---"
              printf '%s\n' "${candidate_books}" | jq . || printf '%s\n' "${candidate_books}"
              echo "--- reference 127.0.0.1:25610 /api/v1/series ---"
              printf '%s\n' "${reference_series}" | jq . || printf '%s\n' "${reference_series}"
              echo "--- candidate 127.0.0.1:25611 /api/v1/series ---"
              printf '%s\n' "${candidate_series}" | jq . || printf '%s\n' "${candidate_series}"
              # The readiness predicate above asserts a one-shot's seriesTitle, which is only
              # correct once REFRESH_SERIES_METADATA has run for that series. When it does not
              # match, the open question is always "did that task run, die, or never get
              # claimed" — and that is answered by the queue, not by the HTTP response.
              #
              # Read SQLite directly rather than the native GET /tasks endpoint: this step
              # authenticates with basic auth, which the native API does not accept, and the
              # table also exposes last_error and lease_expires_at_ms, which the counts
              # endpoint does not. WAL mode allows this concurrent read while the server holds
              # the database open.
              candidate_database="${RUNNER_TEMP}/xoboro.sqlite"
              echo "--- candidate task queue ---"
              sqlite3 "${candidate_database}" \
                "select id, task_type, state, attempt_count, max_attempts,
                        lease_expires_at_ms, substr(coalesce(last_error, ''), 1, 400)
                 from task order by created_at_ms;" 2>&1 || true
              echo "--- candidate series rows ---"
              # The timestamps are the discriminator, not decoration.
              # initialize_series_metadata (V14) fires AFTER INSERT ON series and seeds
              # series_metadata from series.name, copying series.created_at_ms into
              # updated_at_ms. MetadataRefreshLifecycle.refreshSeries stamps a fresh
              # updated_at_ms only when at least one provider returned a patch; when none
              # did, it returns early without upserting at all. So:
              #
              #   m.updated_at_ms == s.created_at_ms  -> refresh applied nothing
              #                                          (every series provider returned null)
              #   m.updated_at_ms >  s.created_at_ms  -> refresh applied, then something else
              #                                          put the trigger default back
              #
              # Those two need entirely different fixes and the previous probe could not tell
              # them apart, which is why it narrowed the cause without identifying it.
              sqlite3 "${candidate_database}" \
                "select s.id, s.name, s.oneshot, s.relative_uri, s.deleted_at_ms,
                        s.created_at_ms, m.title, m.title_lock, m.updated_at_ms
                 from series s left join series_metadata m on m.series_id = s.id
                 order by s.name;" 2>&1 || true
              echo "--- candidate book rows ---"
              # An empty book list for the series is the only single condition that makes both
              # ComicInfoMetadataProvider and OneShotSeriesMetadataProvider return null at the
              # same time, and it happens if the book is not attached to the series the refresh
              # ran against. Dump the join rather than assuming it holds.
              sqlite3 "${candidate_database}" \
                "select b.id, b.name, b.series_id, b.deleted_at_ms, bm.title,
                        bm.updated_at_ms
                 from book b left join book_metadata bm on bm.book_id = b.id
                 order by b.name;" 2>&1 || true
              echo "--- candidate server log (scan/analyze/refresh) ---"
              grep -iE 'scan|analyz|refresh|metadata|error|exception' \
                "${RUNNER_TEMP}/xoboro.log" 2>/dev/null | tail -80 || true
            } >&2
            exit 1
          fi

          reference_book_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25610/api/v1/books?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == false and .metadata.number == "1") | .id'
          )"
          candidate_book_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25611/api/v1/books?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == false and .metadata.number == "1") | .id'
          )"
          reference_series_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25610/api/v1/series?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == false) | .id'
          )"
          candidate_series_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25611/api/v1/series?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == false) | .id'
          )"
          reference_next_book_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25610/api/v1/books?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == false and .metadata.number == "2") | .id'
          )"
          candidate_next_book_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25611/api/v1/books?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == false and .metadata.number == "2") | .id'
          )"
          reference_oneshot_book_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25610/api/v1/books?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == true) | .id'
          )"
          candidate_oneshot_book_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25611/api/v1/books?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == true) | .id'
          )"
          reference_oneshot_series_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25610/api/v1/series?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == true) | .id'
          )"
          candidate_oneshot_series_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25611/api/v1/series?page=0&size=20" |
              jq --exit-status --raw-output \
                '.content[] | select(.oneshot == true) | .id'
          )"
          reference_library_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25610/api/v1/libraries" |
              jq --exit-status --raw-output '.[0].id'
          )"
          candidate_library_id="$(
            curl --fail --silent --show-error \
              --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
              "http://127.0.0.1:25611/api/v1/libraries" |
              jq --exit-status --raw-output '.[0].id'
          )"

          for target in \
            "25610:${reference_series_id}:${reference_book_id}:KOMGA_REFERENCE" \
            "25611:${candidate_series_id}:${candidate_book_id}:XOBORO_CANDIDATE"; do
            port="${target%%:*}"
            remainder="${target#*:}"
            series_id="${remainder%%:*}"
            remainder="${remainder#*:}"
            book_id="${remainder%%:*}"
            variable_prefix="${remainder#*:}"

            collection_id="$(
              jq --null-input --compact-output \
                --arg series_id "${series_id}" \
                '{
                  name: "Fixture Collection",
                  ordered: true,
                  seriesIds: [$series_id]
                }' |
                curl --fail --silent --show-error \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --request POST "http://127.0.0.1:${port}/api/v1/collections" \
                  --header "Content-Type: application/json" \
                  --data-binary @- |
                jq --exit-status --raw-output '.id'
            )"
            read_list_id="$(
              jq --null-input --compact-output \
                --arg book_id "${book_id}" \
                '{
                  name: "Fixture Read List",
                  summary: "Fixture list summary",
                  ordered: true,
                  bookIds: [$book_id]
                }' |
                curl --fail --silent --show-error \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --request POST "http://127.0.0.1:${port}/api/v1/readlists" \
                  --header "Content-Type: application/json" \
                  --data-binary @- |
                jq --exit-status --raw-output '.id'
            )"
            printf '%s_COLLECTION_ID=%s\n' "${variable_prefix}" "${collection_id}" \
              >>"${GITHUB_ENV}"
            printf '%s_READ_LIST_ID=%s\n' "${variable_prefix}" "${read_list_id}" \
              >>"${GITHUB_ENV}"
          done

          printf 'KOMGA_REFERENCE_BOOK_ID=%s\n' "${reference_book_id}" \
            >>"${GITHUB_ENV}"
          printf 'XOBORO_CANDIDATE_BOOK_ID=%s\n' "${candidate_book_id}" \
            >>"${GITHUB_ENV}"
          printf 'KOMGA_REFERENCE_SERIES_ID=%s\n' "${reference_series_id}" \
            >>"${GITHUB_ENV}"
          printf 'XOBORO_CANDIDATE_SERIES_ID=%s\n' "${candidate_series_id}" \
            >>"${GITHUB_ENV}"
          printf 'KOMGA_REFERENCE_NEXT_BOOK_ID=%s\n' "${reference_next_book_id}" \
            >>"${GITHUB_ENV}"
          printf 'XOBORO_CANDIDATE_NEXT_BOOK_ID=%s\n' "${candidate_next_book_id}" \
            >>"${GITHUB_ENV}"
          printf 'KOMGA_REFERENCE_ONESHOT_BOOK_ID=%s\n' "${reference_oneshot_book_id}" \
            >>"${GITHUB_ENV}"
          printf 'XOBORO_CANDIDATE_ONESHOT_BOOK_ID=%s\n' "${candidate_oneshot_book_id}" \
            >>"${GITHUB_ENV}"
          printf 'KOMGA_REFERENCE_ONESHOT_SERIES_ID=%s\n' "${reference_oneshot_series_id}" \
            >>"${GITHUB_ENV}"
          printf 'XOBORO_CANDIDATE_ONESHOT_SERIES_ID=%s\n' "${candidate_oneshot_series_id}" \
            >>"${GITHUB_ENV}"
          printf 'KOMGA_REFERENCE_LIBRARY_ID=%s\n' "${reference_library_id}" \
            >>"${GITHUB_ENV}"
          printf 'XOBORO_CANDIDATE_LIBRARY_ID=%s\n' "${candidate_library_id}" \
            >>"${GITHUB_ENV}"

      - name: Compare authenticated synthetic catalog and media
        env:
          SYNTHETIC_EMAIL: admin@example.invalid
          SYNTHETIC_PASSWORD: xoboro-differential-only
        run: |
          KOMGA_DIFFERENTIAL_AUTHORIZATION="$(
            printf 'Basic %s' "$(
              printf '%s:%s' "${SYNTHETIC_EMAIL}" "${SYNTHETIC_PASSWORD}" |
                base64 --wrap=0
            )"
          )"
          export KOMGA_DIFFERENTIAL_AUTHORIZATION
          ./gradlew :compatibility:komga-differential:run --args="\
          --reference http://127.0.0.1:25610 \
          --candidate http://127.0.0.1:25611 \
          --suite compatibility/komga-differential/suites/komga-1.25.0-catalog.json"
          ./gradlew :compatibility:komga-differential:run --args="\
          --reference http://127.0.0.1:25610 \
          --candidate http://127.0.0.1:25611 \
          --suite compatibility/komga-differential/suites/komga-1.25.0-opds-v1.json"
          ./gradlew :compatibility:komga-differential:run --args="\
          --reference http://127.0.0.1:25610 \
          --candidate http://127.0.0.1:25611 \
          --suite compatibility/komga-differential/suites/komga-1.25.0-media.json"

      - name: Verify authenticated media revalidation
        env:
          SYNTHETIC_EMAIL: admin@example.invalid
          SYNTHETIC_PASSWORD: xoboro-differential-only
        run: |
          for endpoint in \
            opds/v2/catalog \
            "opds/v2/libraries/browse?page=0&size=20" \
            "opds/v2/search?query=Series"; do
            for port in 25610 25611; do
              url="http://127.0.0.1:${port}/${endpoint}"
              etag="$(
                curl --fail --silent --show-error \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --dump-header - --output /dev/null "${url}" |
                  awk -F': ' 'tolower($1) == "etag" {
                    sub("\r$", "", $2)
                    print $2
                  }'
              )"
              test -n "${etag}"
            done
          done

          for endpoint in \
            pages \
            manifest \
            thumbnail \
            pages/1 \
            "pages/1?convert=jpeg" \
            pages/1/thumbnail; do
            for target in \
              "25610:${KOMGA_REFERENCE_BOOK_ID}" \
              "25611:${XOBORO_CANDIDATE_BOOK_ID}"; do
              port="${target%%:*}"
              book_id="${target#*:}"
              url="http://127.0.0.1:${port}/api/v1/books/${book_id}/${endpoint}"
              etag="$(
                curl --fail --silent --show-error \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --dump-header - --output /dev/null "${url}" |
                  awk -F': ' 'tolower($1) == "etag" {
                    sub("\r$", "", $2)
                    print $2
                  }'
              )"
              test -n "${etag}"
              http_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --header "If-None-Match: ${etag}" "${url}"
              )"
              test "${http_status}" = "304"
            done
          done

          for endpoint in pages/1 pages/1/thumbnail; do
            for target in \
              "25610:${KOMGA_REFERENCE_BOOK_ID}" \
              "25611:${XOBORO_CANDIDATE_BOOK_ID}"; do
              port="${target%%:*}"
              book_id="${target#*:}"
              url="http://127.0.0.1:${port}/api/v1/books/${book_id}/${endpoint}"
              modified="$(
                curl --fail --silent --show-error \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --dump-header - --output /dev/null "${url}" |
                  awk -F': ' 'tolower($1) == "last-modified" {
                    sub("\r$", "", $2)
                    print $2
                  }'
              )"
              test -n "${modified}"
              http_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --header "If-Modified-Since: ${modified}" "${url}"
              )"
              test "${http_status}" = "304"
            done
          done

          for route in \
            "opds/v1.2:pages/0" \
            "opds/v2:pages/1" \
            "opds/v2:thumbnail"; do
            route_prefix="${route%%:*}"
            route_suffix="${route#*:}"
            for target in \
              "25610:${KOMGA_REFERENCE_BOOK_ID}" \
              "25611:${XOBORO_CANDIDATE_BOOK_ID}"; do
              port="${target%%:*}"
              book_id="${target#*:}"
              url="http://127.0.0.1:${port}/${route_prefix}/books/${book_id}/${route_suffix}"
              etag="$(
                curl --fail --silent --show-error \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --dump-header - --output /dev/null "${url}" |
                  awk -F': ' 'tolower($1) == "etag" {
                    sub("\r$", "", $2)
                    print $2
                  }'
              )"
              test -n "${etag}"
              http_status="$(
                curl --silent --output /dev/null --write-out '%{http_code}' \
                  --user "${SYNTHETIC_EMAIL}:${SYNTHETIC_PASSWORD}" \
                  --header "If-None-Match: ${etag}" "${url}"
              )"
              test "${http_status}" = "304"
            done
          done

      - name: Show server logs after failure
        if: failure()
        run: |
          docker logs komga-reference || true
          cat "${RUNNER_TEMP}/xoboro.log" || true

      - name: Stop servers
        if: always()
        run: |
          docker rm --force komga-reference || true
          if [ -f "${RUNNER_TEMP}/xoboro.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/xoboro.pid")" || true
          fi
