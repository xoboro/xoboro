<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111418" />
    <!--
      Every icon and manifest href is relative, for the same reason vite.config.js
      pins `base: './'`: the server can be deployed under a context path, and an
      absolute "/favicon.svg" would 404 under /xoboro. The paths inside the
      manifest resolve against the manifest's own URL, so they travel too.

      No favicon.ico. A browser's implicit request for one goes to the origin
      root, which a context-path deployment does not own, so the file could not
      answer it anyway; the explicit links below are what browsers actually use.
    -->
    <!--
      The SVG is referenced out of src/ rather than copied into public/ so there is
      one checked-in copy of the artwork; vite bundles and fingerprints it from
      here. The PNGs beside it in public/ are rendered from this same file and
      exist only where a platform will not take an SVG.
    -->
    <link rel="icon" href="./src/assets/xoboro.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!--
      Translucent rather than opaque: the reader deliberately draws under the
      status bar (viewport-fit=cover), and every screen already reserves
      --inset-top for it. An opaque bar would leave a band the tokens cannot
      colour.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Xoboro" />
    <title>Xoboro</title>
    <script id="xoboro-asset-recovery">
      // Run before the module entry: a stale installed document may be unable to
      // import even main.js. Recover once per entry bundle, preserving the route.
      (() => {
        const marker = '_xoboro_recover'
        const initial = new URL(window.location.href)
        const previous = initial.searchParams.get(marker)
        if (previous) {
          initial.searchParams.delete(marker)
          window.history.replaceState(window.history.state, '', initial.href)
        }
        let recovering = false
        const recover = () => {
          if (recovering) return false
          const entry = document.querySelector('script[type="module"][src]')
          if (!entry) return false
          const url = new URL(entry.src, window.location.href)
          if (url.origin !== new URL(window.location.href).origin || !url.pathname.includes('/assets/')) return false
          const key = `xoboro.asset-recovery:${url.pathname}`
          let consumed = previous === url.pathname
          try {
            consumed = consumed || sessionStorage.getItem(key) === '1'
            if (!consumed) sessionStorage.setItem(key, '1')
          } catch {
            // The navigation marker also bounds retries when storage is unavailable.
          }
          if (consumed) return false
          recovering = true
          const destination = new URL(window.location.href)
          destination.searchParams.set(marker, url.pathname)
          window.location.replace(destination.href)
          return true
        }
        window.addEventListener('vite:preloadError', (event) => {
          if (recover()) event.preventDefault()
        })
        window.addEventListener('error', (event) => {
          const element = event.target
          const source = element?.tagName === 'SCRIPT' ? element.src
            : element?.tagName === 'LINK' && ['stylesheet', 'modulepreload'].includes(element.rel) ? element.href : null
          if (!source) return
          const url = new URL(source, window.location.href)
          if (url.origin === new URL(window.location.href).origin && url.pathname.includes('/assets/')) recover()
        }, true)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
